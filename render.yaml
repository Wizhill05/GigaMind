services:
  - type: web
    name: gigamind
    env: python
    buildCommand: (cd frontend && npm install && npm run build) || true; pip install -r requirements.txt
    startCommand: uvicorn gigamind.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GIGAMIND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
