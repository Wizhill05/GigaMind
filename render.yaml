services:
  - type: web
    name: gigamind
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gigamind.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GIGAMIND_API_KEY
        generateValue: true
      - key: DB_PATH
        value: ./gigamind.db
      - key: ENVIRONMENT
        value: production
